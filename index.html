<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISHI AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100dvh}
header{padding:14px;font-size:20px;font-weight:bold;background:#1c1c1c;text-align:center}
#chat{flex:1;overflow-y:auto;padding:12px}
.m{max-width:80%;margin:8px 0;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.u{background:#3b5bdb;margin-left:auto}
.b{background:#2a2a2a}
form{display:flex;gap:8px;padding:10px;background:#1c1c1c}
input{flex:1;padding:12px;border-radius:20px;border:0;background:#2a2a2a;color:#eee;font-size:16px}
button{padding:0 18px;border:0;border-radius:20px;background:#3b5bdb;color:#fff;font-size:16px}
</style>
</head>
<body>
<header>RISHI AI</header>
<div id="chat"></div>
<form id="f">
<input id="t" placeholder="Kuch poochho..." autocomplete="off">
<button>Bhejo</button>
</form>
<script>
const API_URL = "https://rishi-ai.rishabhyadav5138.workers.dev";
const chat = document.getElementById("chat");
const f = document.getElementById("f");
const t = document.getElementById("t");

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

add("Namaste! Main RISHI AI hu. Aap kya jaanna chahte ho?", "b");

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = t.value.trim();
  if (!msg) return;
  t.value = "";
  add(msg, "u");
  const wait = add("...", "b");
  try {
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });
    const data = await r.json();
    wait.textContent = data.reply;
  } catch (err) {
    wait.textContent = "Kuch gadbad ho gayi, dobara try karo.";
  }
});
</script>
</body>
  </html>
